; GekiIo.dll settings. Lives next to GekiIo.dll. Re-edit and just relaunch the game to apply - no rebuild needed.

; Substring of the game's window title, used for two things: (1) the coin key is only pressed while this window is
; in front, so a mistyped title here means coin presses silently do nothing (safe) rather than leaking into another
; app; (2) GekiBridge.exe's --window option (set separately, in its own command line/launcher) uses the same idea
; for screen capture. CONFIRM this against the real game once installed - "MU3" is an unverified guess.
WindowTitle=MU3

; Virtual-key code (hex) pressed for a coin insert, held exactly as long as the iPad's COIN button is held. mu3io.h
; has no coin API, so this is injected the same low-risk way maimai's coin button was. 0x72 = F3 (matches the
; maimai/AquaMai default coin key, kept for consistency - CONFIRM against your actual segatools coin config).
CoinKey=0x72

; Set to 1 to let the coin key fire regardless of which window is focused (not recommended - see WindowTitle above).
AnyWindow=0
